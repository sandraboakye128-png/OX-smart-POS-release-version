{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="text-center">
        <div class="text-6xl mb-4">🚧</div>
        <h1 class="text-4xl font-bold text-yellow-500 mb-4">{{ t("uc.title") }}</h1>
        <p class="text-xl text-gray-600">{{ t("uc.line1") }}</p>
        <p class="text-gray-500 mt-2">{{ t("uc.line2") }}</p>
        <div class="mt-6 flex flex-wrap justify-center gap-3">
            <a href="/" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg transition">
                {{ t("uc.to_dashboard") }}
            </a>
            <a href="/products" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded-lg transition">
                {{ t("uc.view_products") }}
            </a>
        </div>
        <p class="text-sm text-gray-400 mt-6">{{ t("uc.eta") }}</p>
    </div>
</div>
{% endblock %}
