{% extends 'base.html' %}

{% block content %}
<!-- Offline banner -->
<div id="offlineBanner" class="fixed top-0 left-0 w-full bg-red-500 text-white text-center py-2 z-50 hidden">
    {{ t("auth.login_offline_banner") }}
</div>

<div class="min-h-[80vh] flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <h2 class="text-3xl font-bold text-indigo-600">{{ t("auth.login_title") }}</h2>
            <p class="text-gray-500 mt-1">{{ t("auth.login_subtitle") }}</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">{{ t("auth.login_username") }}</label>
                <input type="text" id="username" name="username" required autocomplete="off"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">{{ t("auth.login_password") }}</label>
                <input type="text" id="password" name="password" required autocomplete="off" class="masked-password"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="mb-6">
                <label class="flex items-center">
                    <input type="checkbox" id="showPassword" class="mr-2">
                    <span class="text-sm text-gray-600">{{ t("auth.show_password") }}</span>
                </label>
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-2 px-4 rounded-lg transition">
                {{ t("auth.login_btn") }}
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-gray-600">{{ t("auth.login_no_account") }} 
                <a href="/signup" class="text-indigo-600 hover:underline">{{ t("auth.signup_link") }}</a>
            </p>
            <div class="mt-4">
                <a href="/offline/" class="text-xs text-gray-500 hover:text-indigo-600 underline">← Back to mode selection</a>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    //  CLEAR ALL BROWSER DATA (localStorage, sessionStorage, IndexedDB, caches)
    // ============================================================
    async function clearAllBrowserData() {
        console.log('🧹 Clearing all browser data...');
        
        // 1. Clear localStorage
        try {
            const keysToPreserve = []; // Preserve nothing on login
            Object.keys(localStorage).forEach(key => {
                if (!keysToPreserve.includes(key)) {
                    localStorage.removeItem(key);
                }
            });
            console.log('✅ localStorage cleared');
        } catch(e) { console.warn('localStorage clear failed:', e); }
        
        // 2. Clear sessionStorage
        try {
            sessionStorage.clear();
            console.log('✅ sessionStorage cleared');
        } catch(e) { console.warn('sessionStorage clear failed:', e); }
        
        // 3. Clear IndexedDB databases
        const dbNames = [
            'OxSmartOfflineDB',
            'OfflineSalesDB',
            'SalesDB',
            'offlineDB',
            'PendingDB',
            'ImportQueueDB',
            'DexieDB'
        ];
        for (const dbName of dbNames) {
            try {
                const deleteRequest = indexedDB.deleteDatabase(dbName);
                deleteRequest.onsuccess = () => console.log(`✅ Deleted IndexedDB: ${dbName}`);
                deleteRequest.onerror = () => console.warn(`⚠️ Failed to delete: ${dbName}`);
            } catch(e) {}
        }
        
        // 4. Clear browser caches
        if ('caches' in window) {
            try {
                const cacheNames = await caches.keys();
                await Promise.all(cacheNames.map(name => caches.delete(name)));
                console.log(`✅ Cleared ${cacheNames.length} caches`);
            } catch(e) { console.warn('Cache clear failed:', e); }
        }
        
        console.log('🎉 All browser data cleared');
    }

    // ============================================================
    //  SMART SESSION CHECK – redirect if valid, otherwise clear stale
    // ============================================================
    (function() {
        // Skip session check if we just logged out (prevents stale session ghost)
        try {
            var _qs = new URLSearchParams(window.location.search);
            if (_qs.get('logged_out') === '1') {
                localStorage.removeItem('ox_user');
                localStorage.removeItem('ox_api_token');
                localStorage.removeItem('ox_shell_user');
                localStorage.removeItem('pin_unlocked');
                console.log('[login] fresh logout — session check skipped');
                return;
            }
        } catch (e) {}
        const storedUser = localStorage.getItem('ox_user');
        if (storedUser) {
            try {
                const session = JSON.parse(storedUser);
                const isExpired = session.expiresAt && Date.now() >= session.expiresAt;
                
                // If online, verify with server
                if (navigator.onLine) {
                    fetch('/api/auth/check', { credentials: 'include' })
                        .then(res => res.json())
                        .then(data => {
                            if (data.logged_in) { 
                                if (document.activeElement && (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA")) { 
                                    console.log("Typing detected, skipping redirect"); 
                                    return; 
                                }
                                // Server says we're logged in – redirect
                                console.log('Blocked redirect to home');
                            } else {
                                // Server says not logged in – clear stale session
                                localStorage.removeItem('ox_user');
                                localStorage.removeItem('pin_unlocked');
                                console.log("Session invalid, ignoring reload.");
                            }
                        })
                        .catch(() => {
                            if (!isExpired) {
                                console.log('Blocked redirect to home');
                            } else {
                                localStorage.removeItem('ox_user');
                            }
                        });
                } else {
                    if (!isExpired) {
                        console.log('Blocked redirect to home');
                    } else {
                        localStorage.removeItem('ox_user');
                    }
                }
            } catch (e) {
                localStorage.removeItem('ox_user');
            }
        }
    })();

    // ============================================================
    //  OFFLINE BANNER
    // ============================================================
    function updateOfflineBanner() {
        var banner = document.getElementById('offlineBanner');
        if (!banner) return;
        if (!navigator.onLine) banner.classList.remove('hidden');
        else banner.classList.add('hidden');
        // NOTE: we no longer disable the button — the submit handler
        // already blocks offline logins with an alert. Disabling/enabling
        // was causing focus recalc + keyboard drop on Android WebView.
    }
    window.addEventListener('online', updateOfflineBanner);
    window.addEventListener('offline', updateOfflineBanner);

    // ============================================================
    //  CLEAR FORM FIELDS
    // ============================================================
    function clearFormFields() {
        document.querySelectorAll('#loginForm input[type="text"], #loginForm input[type="password"]').forEach(input => {
            if (document.activeElement !== input) input.value = '';
        });
        var sp = document.getElementById('showPassword');
        if (sp && document.activeElement !== sp) sp.checked = false;
        var pw = document.getElementById('password');
        if (pw && document.activeElement !== pw) {
            pw.classList.add('masked-password');
            var sp = document.getElementById('showPassword');
            if (sp) sp.checked = false;
        }
    }

    function forceClear() {
        clearFormFields();
        // NOTE: no setTimeout re-clears here.
        // On Android WebView, setting input.value while it is focused
        // closes the keyboard. Only clear once at page load.
    }

    document.addEventListener('DOMContentLoaded', function() {
        forceClear();
        updateOfflineBanner();
    });

    // REMOVED pageshow forceClear — it was causing the keyboard to close
    // when the WebView resized on Android.

    // ============================================================
    //  TOGGLE PASSWORD VISIBILITY
    // ============================================================
    const showPasswordCheckbox = document.getElementById('showPassword');
    const passwordField = document.getElementById('password');
    // KB_FIX: Toggle CSS class instead of input type to prevent keyboard drop
    showPasswordCheckbox.addEventListener('change', () => {
        if (showPasswordCheckbox.checked) {
            passwordField.classList.remove('masked-password');
        } else {
            passwordField.classList.add('masked-password');
        }
    });
    
    // ============================================================
    //  HANDLE LOGIN SUBMISSION (with full data clear + 24h expiry)
    // ============================================================
    const loginForm = document.getElementById('loginForm');
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!navigator.onLine) {
            alert('{{ t("auth.offline_msg") }}');
            return;
        }
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        
        // Show loading state
        const loginBtn = document.getElementById('loginBtn');
        const originalText = loginBtn.textContent;
        loginBtn.disabled = true;
        loginBtn.textContent = '{{ t("auth.login_logging_in") }}';
        
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',  // ✅ Ensure cookies are sent
                body: JSON.stringify({ username, password })
            });
            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.error || 'Login failed');
            }
            const data = await response.json();
            if (data.success) {
                // ✅ CLEAR ALL OLD BROWSER DATA FIRST
                loginBtn.textContent = '{{ t("auth.login_clearing") }}';
                await clearAllBrowserData();
                
                // ✅ Store NEW session with 24-hour expiry
                const session = {
                    username: data.user.username,
                    role: data.user.role,
                    id: data.user.id,
                    loginTime: Date.now(),
                    expiresAt: Date.now() + 24 * 60 * 60 * 1000
                };
                localStorage.setItem('ox_user', JSON.stringify(session));
                console.log('✅ New session stored for:', data.user.username);
                
                // ✅ Redirect with cache-buster to force fresh page load
                loginBtn.textContent = '{{ t("auth.login_success_loading") }}';
                window.location.href = '/?_t=' + Date.now();
            } else {
                alert('Login failed: ' + data.error);
                loginBtn.disabled = false;
                loginBtn.textContent = originalText;
            }
        } catch (error) {
            console.error('Login error:', error);
            alert('{{ t("auth.err_login_failed") }}');
            loginBtn.disabled = false;
            loginBtn.textContent = originalText;
        }
    });
</script>
<style>
.masked-password { -webkit-text-security: disc; }
</style>
{% endblock %}
