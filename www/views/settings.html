<!-- ============================================================ -->
<!-- VIEW: Settings — bundled, offline-first, controls the shell   -->
<!-- ============================================================ -->

<div class="p-1 md:p-2 space-y-4">

    <!-- Header -->
    <div class="bg-white rounded-2xl shadow-sm p-4 border border-gray-100/80 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-2">
            <button onclick="backToDashboard()"
                    class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-semibold">
                ← Back
            </button>
            <h2 class="text-lg md:text-xl font-bold text-gray-800 flex items-center gap-2">
                ⚙️ Settings
            </h2>
            <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-100 text-emerald-700">APK · Dexie</span>
        </div>
        <div class="flex items-center gap-2">
            <span id="stSaveStatus" class="text-sm hidden"></span>
            <button id="stSaveBtn"
                    class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">
                💾 Save Settings
            </button>
        </div>
    </div>

    <!-- Pending indicator -->
    <div id="stPendingBox" class="hidden bg-yellow-50 border border-yellow-300 text-yellow-800 px-4 py-2 rounded-lg text-xs">
        ⏳ <span id="stPendingText">You have pending settings changes waiting to sync.</span>
    </div>

    <!-- ===== THEME ===== -->
    <div class="bg-white rounded-2xl shadow-sm p-4 border border-gray-100/80">
        <h3 class="text-base font-semibold text-gray-700 mb-3">🎨 Theme</h3>
        <div class="flex flex-wrap gap-3">
            <button type="button"
                    class="st-theme-option px-5 py-3 rounded-xl border-2 transition-all"
                    data-theme="light" id="stThemeLight">
                <div class="flex items-center gap-3">
                    <span style="font-size: 1.5rem;">☀️</span>
                    <div class="text-left">
                        <div class="font-medium text-gray-700">Light</div>
                        <div class="text-[11px] text-gray-400">Bright surfaces</div>
                    </div>
                </div>
            </button>
            <button type="button"
                    class="st-theme-option px-5 py-3 rounded-xl border-2 transition-all"
                    data-theme="dark" id="stThemeDark">
                <div class="flex items-center gap-3">
                    <span style="font-size: 1.5rem;">🌙</span>
                    <div class="text-left">
                        <div class="font-medium text-gray-700">Dark</div>
                        <div class="text-[11px] text-gray-400">Night mode</div>
                    </div>
                </div>
            </button>
        </div>
    </div>

    <!-- ===== CURRENCY ===== -->
    <div class="bg-white rounded-2xl shadow-sm p-4 border border-gray-100/80">
        <h3 class="text-base font-semibold text-gray-700 mb-3">💰 Currency</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Currency Symbol</label>
                <select id="stCurrencySymbol"
                        class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm bg-white text-gray-800">
                    <option value="₵">₵ (Cedi)</option>
                    <option value="$">$ (Dollar)</option>
                    <option value="€">€ (Euro)</option>
                    <option value="£">£ (Pound)</option>
                    <option value="₦">₦ (Naira)</option>
                    <option value="R">R (Rand)</option>
                    <option value="KSh">KSh (Kenya Shilling)</option>
                    <option value="TSh">TSh (Tanzania Shilling)</option>
                    <option value="UGX">UGX (Uganda Shilling)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Currency Code</label>
                <select id="stCurrencyCode"
                        class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm bg-white text-gray-800">
                    <option value="GHS">GHS (Ghana Cedi)</option>
                    <option value="USD">USD (US Dollar)</option>
                    <option value="EUR">EUR (Euro)</option>
                    <option value="GBP">GBP (British Pound)</option>
                    <option value="NGN">NGN (Nigerian Naira)</option>
                    <option value="ZAR">ZAR (South African Rand)</option>
                    <option value="KES">KES (Kenya Shilling)</option>
                    <option value="TZS">TZS (Tanzania Shilling)</option>
                    <option value="UGX">UGX (Uganda Shilling)</option>
                </select>
            </div>
        </div>
        <div class="mt-3 p-3 bg-gray-50 rounded-xl">
            <p class="text-sm text-gray-600">
                <span class="font-medium">Preview:</span>
                <span id="stCurrencyPreview" class="font-bold text-amber-600">₵1,000.00</span>
            </p>
        </div>
    </div>

    <!-- ===== LANGUAGE & DATE ===== -->
    <div class="bg-white rounded-2xl shadow-sm p-4 border border-gray-100/80">
        <h3 class="text-base font-semibold text-gray-700 mb-3">🌐 Language & Date</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Interface Language</label>
                <select id="stLanguage"
                        class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm bg-white text-gray-800">
                    <option value="en">🇬🇧 English</option>
                    <option value="es">🇪🇸 Spanish</option>
                    <option value="fr">🇫🇷 French</option>
                    <option value="pt">🇵🇹 Portuguese</option>
                    <option value="ha">🇳🇬 Hausa</option>
                    <option value="yo">🇳🇬 Yoruba</option>
                    <option value="ig">🇳🇬 Igbo</option>
                    <option value="pcm">🇳🇬 Nigerian Pidgin</option>
                    <option value="tw">🇬🇭 Twi</option>
                    <option value="ga">🇬🇭 Ga</option>
                    <option value="ewe">🇬🇭 Ewe</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Date Format</label>
                <select id="stDateFormat"
                        class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm bg-white text-gray-800">
                    <option value="DD/MM/YYYY">DD/MM/YYYY</option>
                    <option value="MM/DD/YYYY">MM/DD/YYYY</option>
                    <option value="YYYY-MM-DD">YYYY-MM-DD</option>
                    <option value="DD-MM-YYYY">DD-MM-YYYY</option>
                    <option value="MM-DD-YYYY">MM-DD-YYYY</option>
                </select>
            </div>
        </div>
    </div>

    <!-- ===== SESSION ===== -->
    <div class="bg-white rounded-2xl shadow-sm p-4 border border-gray-100/80">
        <h3 class="text-base font-semibold text-gray-700 mb-3">ℹ️ Session Info</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
            <div class="bg-gray-50 rounded-xl p-3">
                <span class="text-xs text-gray-500">User</span>
                <div class="font-semibold text-gray-800" id="stSessionUser">—</div>
            </div>
            <div class="bg-gray-50 rounded-xl p-3">
                <span class="text-xs text-gray-500">Role</span>
                <div class="font-semibold text-gray-800" id="stSessionRole">—</div>
            </div>
            <div class="bg-gray-50 rounded-xl p-3">
                <span class="text-xs text-gray-500">Theme</span>
                <div class="font-semibold text-gray-800" id="stSessionTheme">Dark</div>
            </div>
            <div class="bg-gray-50 rounded-xl p-3">
                <span class="text-xs text-gray-500">Currency</span>
                <div class="font-semibold text-gray-800" id="stSessionCurrency">₵</div>
            </div>
        </div>
    </div>

</div>

<!-- ===================== STYLES ===================== -->
<style>
    .st-theme-option {
        background: #ffffff;
        border-color: #e5e7eb;
        cursor: pointer;
        min-width: 160px;
    }
    .st-theme-option:hover  { border-color: #fbbf24; }
    .st-theme-option.active {
        border-color: #f59e0b !important;
        background: #fffbeb;
    }
</style>

<!-- ===================== SCRIPT ===================== -->
<script>
(function() {
'use strict';

const $ = id => document.getElementById(id);
const RENDER = 'https://ox-smart-pos-release-version.onrender.com';
function _settingsKey() {
    try {
        const u = JSON.parse(localStorage.getItem('ox_shell_user') || 'null');
        const id = (u && (u.id != null)) ? String(u.id)
                 : (u && u.username) ? String(u.username)
                 : 'anon';
        return 'ox_app_settings_' + id;
    } catch (e) { return 'ox_app_settings_anon'; }
}
const STORAGE_KEY = _settingsKey();

// ---------- Defaults ----------
const DEFAULTS = {
    theme: 'dark',
    currency_symbol: '₵',
    currency_code: 'GHS',
    language: 'en',
    date_format: 'DD/MM/YYYY'
};

// ---------- Utilities ----------
function toast(msg, isError) {
    if (typeof window.showToast === 'function') {
        window.showToast(msg, { error: !!isError });
    }
}
function notifyBell() {
    if (typeof window.refreshPendingNotifications === 'function') {
        try { window.refreshPendingNotifications(); } catch (e) {}
    }
}

function getSettings() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return Object.assign({}, DEFAULTS);
        const parsed = JSON.parse(raw);
        return Object.assign({}, DEFAULTS, parsed || {});
    } catch (e) {
        return Object.assign({}, DEFAULTS);
    }
}

function saveSettingsLocal(s) {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
    } catch (e) {
        console.warn('[settings] save local failed:', e);
    }
}

// ---------- Apply theme to the shell ----------
function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
}

// ---------- Render form from state ----------
function renderForm() {
    const s = getSettings();

    // Theme buttons
    const light = $('stThemeLight');
    const dark  = $('stThemeDark');
    light.classList.remove('active');
    dark.classList.remove('active');
    if (s.theme === 'light') light.classList.add('active');
    else dark.classList.add('active');

    // Dropdowns
    $('stCurrencySymbol').value = s.currency_symbol;
    $('stCurrencyCode').value   = s.currency_code;
    $('stLanguage').value       = s.language;
    $('stDateFormat').value     = s.date_format;

    updatePreview();
    updateSessionInfo();
}

function updatePreview() {
    const symbol = $('stCurrencySymbol').value;
    $('stCurrencyPreview').textContent = symbol + '1,000.00';
    $('stSessionCurrency').textContent = symbol;
    $('stSessionTheme').textContent    = ($('stThemeDark').classList.contains('active')) ? 'Dark' : 'Light';
}

function updateSessionInfo() {
    try {
        const u = JSON.parse(localStorage.getItem('ox_shell_user') || 'null');
        if (u && u.username) {
            $('stSessionUser').textContent = u.username;
            $('stSessionRole').textContent = u.role || 'user';
        } else {
            $('stSessionUser').textContent = '—';
            $('stSessionRole').textContent = '—';
        }
    } catch (e) { /* ignore */ }
}

// ---------- Build current form values ----------
function readForm() {
    const theme = $('stThemeLight').classList.contains('active') ? 'light' : 'dark';
    return {
        theme,
        currency_symbol: $('stCurrencySymbol').value,
        currency_code:   $('stCurrencyCode').value,
        language:        $('stLanguage').value,
        date_format:     $('stDateFormat').value
    };
}

// ---------- Pending ops ----------
async function savePending(settings) {
    if (typeof db === 'undefined' || !db) return;
    try {
        await db.pending_ops.add({
            table: 'settings',
            operation: 'update',
            record_id: 'settings',
            payload: settings,
            timestamp: new Date().toISOString(),
            attempts: 0,
            synced: 0
        });
        notifyBell();
    } catch (e) {
        console.warn('[settings] queue failed:', e);
    }
}

async function refreshPendingIndicator() {
    if (typeof db === 'undefined' || !db) return;
    try {
        const count = await db.pending_ops.where('table').equals('settings')
            .and(op => op.synced === 0).count();
        const box = $('stPendingBox');
        const txt = $('stPendingText');
        if (count > 0) {
            txt.textContent = count + ' settings change' + (count === 1 ? '' : 's') + ' waiting to sync.';
            box.classList.remove('hidden');
        } else {
            box.classList.add('hidden');
        }
    } catch (e) { /* ignore */ }
}

// ---------- Sync pending settings to server ----------
async function syncPendingSettings() {
    if (typeof db === 'undefined' || !db) return;
    if (!navigator.onLine) return;

    let ops = [];
    try {
        ops = await db.pending_ops.where('table').equals('settings')
            .and(op => op.synced === 0).toArray();
    } catch (e) { return; }
    if (ops.length === 0) return;

    // Only need to push the latest one — settings are a single record
    // but we'll push all in order to be safe.
    const token = (typeof getToken === 'function') ? getToken() : null;

    for (const op of ops) {
        try {
            const res = await fetch(RENDER + '/api/settings', {
                method: 'POST',
                credentials: 'include',
                headers: Object.assign(
                    { 'Content-Type': 'application/json' },
                    token ? { 'Authorization': 'Bearer ' + token } : {}
                ),
                body: JSON.stringify(op.payload || {})
            });
            if (res.ok) {
                await db.pending_ops.update(op.id, { synced: 1 });
            } else {
                await db.pending_ops.update(op.id, { attempts: (op.attempts || 0) + 1 });
            }
        } catch (e) {
            /* leave it queued */
        }
    }
    notifyBell();
    refreshPendingIndicator();
}
window.__syncPendingSettingsView = syncPendingSettings;

// ---------- Save button ----------
async function handleSave() {
    const btn = $('stSaveBtn');
    const status = $('stSaveStatus');

    btn.disabled = true;
    btn.textContent = '⏳ Saving…';
    status.classList.remove('hidden');
    status.className = 'text-sm text-gray-500';
    status.textContent = 'Saving…';

    const settings = readForm();

    // 1. Save locally — instant
    saveSettingsLocal(settings);

    // 2. Apply theme immediately to the shell
    applyTheme(settings.theme);

    // 3. Notify the shell to update window.oxSettings
    window.dispatchEvent(new CustomEvent('ox:settingsChanged', { detail: settings }));

    // 4. Update UI
    updateSessionInfo();
    updatePreview();

    // 5. Try direct API if online, else queue
    const token = (typeof getToken === 'function') ? getToken() : null;
    let serverOk = false;

    if (navigator.onLine) {
        try {
            const res = await fetch(RENDER + '/api/settings', {
                method: 'POST',
                credentials: 'include',
                headers: Object.assign(
                    { 'Content-Type': 'application/json' },
                    token ? { 'Authorization': 'Bearer ' + token } : {}
                ),
                body: JSON.stringify(settings)
            });
            if (res.ok) serverOk = true;
        } catch (e) {
            console.warn('[settings] API save failed:', e);
        }
    }

    if (!serverOk) {
        await savePending(settings);
        status.textContent = '✅ Saved locally — will sync when online';
        status.className = 'text-sm text-amber-600';
        toast('✅ Saved locally — will sync later');
    } else {
        status.textContent = '✅ Settings saved!';
        status.className = 'text-sm text-green-600';
        toast('✅ Settings saved');
    }

    // Clear "Saving…" after a moment
    setTimeout(() => {
        status.classList.add('hidden');
    }, 2400);

    btn.disabled = false;
    btn.textContent = '💾 Save Settings';
    refreshPendingIndicator();
}

// ---------- Wiring ----------
document.querySelectorAll('.st-theme-option').forEach(btn => {
    btn.addEventListener('click', function () {
        document.querySelectorAll('.st-theme-option').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const theme = this.dataset.theme === 'light' ? 'light' : 'dark';
        applyTheme(theme);
        updatePreview();
    });
});

['stCurrencySymbol', 'stCurrencyCode'].forEach(id => {
    const el = $(id);
    if (el) el.addEventListener('change', updatePreview);
});

$('stSaveBtn').addEventListener('click', handleSave);

window.addEventListener('online', function() {
    syncPendingSettings();
});

// ---------- INIT ----------
renderForm();
refreshPendingIndicator();
// Attempt sync on open if online
if (navigator.onLine) setTimeout(syncPendingSettings, 800);

})();
</script>
